<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Política de seguridad de contenido: solo se permite código propio y Google Identity Services.
       Bloquea scripts inyectados, estilos en línea y formularios hacia otros sitios. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>RestoApp · Reservas, cocina e inventario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="loginScreen" class="login" hidden>
    <section class="login-card">
      <h1>RestoApp</h1>
      <p class="muted">Reservas, comandas e inventario del restaurante</p>

      <form id="loginForm" autocomplete="off">
        <label class="field"><span>Usuario</span><input name="username" type="text" required maxlength="20" autocomplete="username"></label>
        <label class="field"><span>Contraseña</span><input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
        <button class="btn primary block" type="submit">Ingresar</button>
      </form>

      <form id="totpForm" hidden>
        <p>Escribe el código de 6 dígitos de tu app de autenticación.</p>
        <label class="field"><span>Código</span><input name="code" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" required autocomplete="one-time-code"></label>
        <button class="btn primary block" type="submit">Verificar</button>
        <button id="totpBack" class="btn ghost block" type="button">Volver</button>
      </form>

      <div id="googleBlock" class="google">
        <div class="sep"><span>o</span></div>
        <div id="googleSignInDiv"></div>
      </div>

      <p id="loginError" class="error" role="alert"></p>
      <details class="demo">
        <summary>Usuarios de demostración</summary>
        <p>admin / admin123 · mesero / mesero123 · cocina / cocina123 · despacho / despacho123. Al ingresar te pedirá cambiar la contraseña.</p>
      </details>
    </section>
  </main>

  <div id="appShell" class="shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand">RestoApp</div>
      <nav id="menu"></nav>
      <button id="logoutBtn" class="btn ghost block" type="button">Cerrar sesión</button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menuToggle" class="btn ghost" type="button" aria-label="Abrir menú">☰</button>
        <h2 id="viewTitle"></h2>
        <div class="userbox"><span id="userName"></span><span id="roleBadge" class="badge role"></span></div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <section id="content" class="content"></section>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/crypto.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/twofa.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/google-oauth.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
